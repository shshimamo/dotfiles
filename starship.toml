# symbol用  🅰 🅱 🅲 🅳 🅴 🅵 🅶 🅷 🅸 🅹 🅺 🅻 🅼 🅽 🅾 🅿 🆀 🆁 🆂 🆃 🆄 🆅 🆆 🆇 🆈 🆉

# エディターの補完を設定スキーマに合わせて取得
"$schema" = 'https://starship.rs/config-schema.json'

# シェルのプロンプトの間に空行を挿入する
add_newline = true

# カスタムフォーマットでボーダーを追加
format = """
[────────────────────────────────────────────](dimmed white)
$all\
${env_var.SBX}$character"""

[env_var.SBX]
format = '[\(sbx\) ](bold yellow)'
style = 'bold yellow'

[git_branch]
symbol = '* '

[aws]
# symbol = '🅰 '
disabled = false
# aws login の鍵（~/.aws/login/cache）は Starship が見つけられないので、プロファイル名だけで表示する
force_display = true
# プロファイルが無いときは何も出さない（force_display だけだと空の ☁️ が出る）
format = '(on [$symbol$profile]($style) )'
style = 'bold blue'

[aws.profile_aliases]
Enterprise_Naming_Scheme-voidstars = 'void**'

[gcloud]
disabled = true

[kubernetes]
format = 'on [⛵ ($user on )$context \($namespace\)]($style) '
style = 'dimmed green'
disabled = false
contexts = [
  { context_pattern = "dev.local.cluster.k8s", style = "green", symbol = "💔 " },
  # EKS は ARN が長いので短くし、課金中と気づけるよう赤にする
  { context_pattern = "eks-.*", user_alias = "", style = "bold red" },
]

